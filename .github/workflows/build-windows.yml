name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds the exe and attaches it.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: jenova-windows-x64
          path: target/release/jenova.exe
      # Attach jenova.exe to the release; the in-app updater installs it.
      - name: Attach exe to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/jenova.exe
