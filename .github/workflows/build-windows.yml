name: Build Windows

on:
  push:
    branches: [main]
    # Pushing a version tag builds the exe and creates the release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds the exe and attaches it.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      # A push to main with a version that has no release yet publishes it.
      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path crate/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" installer\jenova.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release for new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Jenova v${{ steps.ver.outputs.version }}
          files: |
            target/installer/Jenova-Setup.exe
            target/release/jenova.exe
          make_latest: true
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: jenova-windows-x64
          path: |
            target/installer/Jenova-Setup.exe
            target/release/jenova.exe
      # Attach jenova.exe to the release; the in-app updater installs it.
      - name: Create release / attach exe
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Jenova ${{ github.ref_name }}
          files: |
            target/installer/Jenova-Setup.exe
            target/release/jenova.exe
          make_latest: true
          overwrite_files: true
