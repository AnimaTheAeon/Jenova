name: Remove old NAS releases

# One-time cleanup: the Synology version now lives in AnimaTheAeon/Jenova-NAS.
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-nas-releases.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete nas-v1.0.0 and nas-v1.0.1 (releases and tags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in nas-v1.0.0 nas-v1.0.1; do
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || echo "$tag: no release"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
          done
